<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Ekskul</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f8fafc;
        color: #1e293b;
        padding: 20px;
    }

    input, textarea {
        padding: 10px;
        width: 100%;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        background-color: #0284c7;
        color: white;
        border: none;
        padding: 10px;
        cursor: pointer;
    }
</style>
</head>
<body>
    <h2>Formulir Pendaftaran Ekskul - RPL </h2>
    
    <form action="#" method="POST">
        <label>Nama Lengkap</label>
        <label>:</label>
        <input type="text" name="nama" placeholder="Ketik namamu di sini!" required><br><br>

        <label>Tanggal Lahir</label>
        <label>:</label>
        <input type="date" name="tanggal" required><br><br>

        <label>Nomor HP/WA</label>
        <label>:</label>
        <input type="number" name="nomor" placeholder="Ketik nomormu di sini!" required><br><br>

        <button type="submit">Kirim</button>
    </form>
</body>
</html>
